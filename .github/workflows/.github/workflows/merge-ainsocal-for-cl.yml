name: Merge AiSocial (Clash)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download, normalize and merge
        run: |
          set -e
          OUT="ainsocalallinoneCl.list"
          : > "$OUT"

          process() {
            local title="$1"
            local url="$2"
            echo "# ==================== ${title} ====================" >> "$OUT"
            curl -fsSL "$url" | sed -E '
              # 删除空行和纯注释可保留注释
              /^[[:space:]]*$/d
              # 已有策略名的行：DOMAIN-SUFFIX,xx,旧策略 → 改成 AiSocial
              s/^(DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN|DOMAIN-WILDCARD|IP-CIDR|IP-CIDR6|PROCESS-NAME|USER-AGENT)(,.*)(,[^,[:space:]]+)[[:space:]]*$/\1\2,AiSocial/I
              # 没有策略名的行：DOMAIN-SUFFIX,xx → 补上 ,AiSocial
              s/^(DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN|DOMAIN-WILDCARD|IP-CIDR|IP-CIDR6|PROCESS-NAME|USER-AGENT)(,[^,[:space:]]+)[[:space:]]*$/\1\2,AiSocial/I
            ' >> "$OUT" || true
            echo "" >> "$OUT"
          }

          process "Dropbox" "https://raw.githubusercontent.com/trakoo/ios_rule_script/refs/heads/master/rule/Clash/Dropbox/Dropbox.list"
          process "GitHub"  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GitHub/GitHub.list"
          process "Meta AI" "https://raw.githubusercontent.com/trakoo/mycustomqx/refs/heads/main/Metacl.list"
          process "OpenAI"  "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list"
          process "XnTG"    "https://raw.githubusercontent.com/trakoo/mycustomqx/refs/heads/main/XnTG.list"

          # 去掉文件末尾多余空行
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$OUT" || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ainsocalallinoneCl.list
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update ainsocalallinoneCl.list"
            git push
          fi
