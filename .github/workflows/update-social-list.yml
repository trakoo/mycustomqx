name: Update XnTG List (Twitter + Telegram)

on:
  schedule:
    # 每天 UTC 时间 0 点 10 分运行（北京时间早上 8:10）
    - cron: '10 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge lists
        run: |
          # 下载两个上游
          curl -sL "https://raw.githubusercontent.com/trakoo/ios_rule_script/refs/heads/master/rule/Clash/Twitter/Twitter.list" -o twitter.list
          curl -sL "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list" -o telegram.list

          # 生成合并文件（带来源说明）
          {
            echo "# XnTG List (Twitter + Telegram)"
            echo "# Auto-updated by GitHub Actions"
            echo "# Last update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "#"
            echo "# Sources:"
            echo "# 1. https://raw.githubusercontent.com/trakoo/ios_rule_script/refs/heads/master/rule/Clash/Twitter/Twitter.list"
            echo "# 2. https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list"
            echo "#"
            echo "# ===== Twitter / X ====="
            cat twitter.list
            echo ""
            echo "# ===== Telegram ====="
            cat telegram.list
          } > temp_all.list

          # 简单去重（保留第一次出现的行）
          awk '!seen[$0]++' temp_all.list > XnTG.list

          # 清理临时文件
          rm -f twitter.list telegram.list temp_all.list

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XnTG.list
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update XnTG.list"
            git push
          fi
